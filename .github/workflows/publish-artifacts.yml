name: Publish artifacts
on:
  release:
    types: [released]

jobs:
  docker-images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build images (native ${{ matrix.arch }})
        run: |
          CVAT_VERSION=latest CLAM_AV=yes docker compose -f docker-compose.yml -f docker-compose.dev.yml build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push per-arch tags to Docker Hub
        env:
          DOCKERHUB_WORKSPACE: ${{ secrets.DOCKERHUB_WORKSPACE }}
          SERVER_IMAGE_REPO: 'server'
          UI_IMAGE_REPO: 'ui'
          TAG: ${{ github.event.release.tag_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Tag per-arch images from local cvat/*:latest to registry with workspace prefix
          docker tag "cvat/server:latest" "${DOCKERHUB_WORKSPACE}/${SERVER_IMAGE_REPO}:latest-${ARCH}"
          docker tag "cvat/server:latest" "${DOCKERHUB_WORKSPACE}/${SERVER_IMAGE_REPO}:${TAG}-${ARCH}"

          docker tag "cvat/ui:latest" "${DOCKERHUB_WORKSPACE}/${UI_IMAGE_REPO}:latest-${ARCH}"
          docker tag "cvat/ui:latest" "${DOCKERHUB_WORKSPACE}/${UI_IMAGE_REPO}:${TAG}-${ARCH}"

          # Push per-arch tags
          docker push "${DOCKERHUB_WORKSPACE}/${SERVER_IMAGE_REPO}:latest-${ARCH}"
          docker push "${DOCKERHUB_WORKSPACE}/${SERVER_IMAGE_REPO}:${TAG}-${ARCH}"

          docker push "${DOCKERHUB_WORKSPACE}/${UI_IMAGE_REPO}:latest-${ARCH}"
          docker push "${DOCKERHUB_WORKSPACE}/${UI_IMAGE_REPO}:${TAG}-${ARCH}"

  manifests:
    runs-on: ubuntu-latest
    needs: docker-images
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          DOCKERHUB_WORKSPACE: ${{ secrets.DOCKERHUB_WORKSPACE }}
          SERVER_IMAGE_REPO: 'server'
          UI_IMAGE_REPO: 'ui'
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Server manifests
          docker manifest create "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${SERVER_IMAGE_REPO}:latest" \
            --amend "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${SERVER_IMAGE_REPO}:latest-amd64" \
            --amend "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${SERVER_IMAGE_REPO}:latest-arm64"
          docker manifest push "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${SERVER_IMAGE_REPO}:latest"

          docker manifest create "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${SERVER_IMAGE_REPO}:${TAG}" \
            --amend "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${SERVER_IMAGE_REPO}:${TAG}-amd64" \
            --amend "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${SERVER_IMAGE_REPO}:${TAG}-arm64"
          docker manifest push "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${SERVER_IMAGE_REPO}:${TAG}"

          # UI manifests
          docker manifest create "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${UI_IMAGE_REPO}:latest" \
            --amend "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${UI_IMAGE_REPO}:latest-amd64" \
            --amend "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${UI_IMAGE_REPO}:latest-arm64"
          docker manifest push "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${UI_IMAGE_REPO}:latest"

          docker manifest create "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${UI_IMAGE_REPO}:${TAG}" \
            --amend "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${UI_IMAGE_REPO}:${TAG}-amd64" \
            --amend "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${UI_IMAGE_REPO}:${TAG}-arm64"
          docker manifest push "registry-1.docker.io/${DOCKERHUB_WORKSPACE}/${UI_IMAGE_REPO}:${TAG}"

  python-packages:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate SDK
        run: |
          pip3 install --user -r cvat-sdk/gen/requirements.txt
          ./cvat-sdk/gen/generate.sh

      - name: Build packages
        run: |
          for d in cvat-sdk cvat-cli; do
            pipx run --spec=build pyproject-build --outdir=dist "$d"
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1


  helm:
    runs-on: ubuntu-latest
    needs: manifests
    env:
      DOCKERHUB_WORKSPACE: ${{ secrets.DOCKERHUB_WORKSPACE }}
    steps:
      - uses: actions/checkout@v4
       # v4.3.1
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.19.0
       # v3.6.0
      - name: Log in to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Package Helm chart
        working-directory: helm-chart
        run: |
          helm package . --dependency-update --destination ../

      - name: Push Helm chart to Docker Hub
        run: |
          helm push cvat-*.tgz oci://registry-1.docker.io/${DOCKERHUB_WORKSPACE}
